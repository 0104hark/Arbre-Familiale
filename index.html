<style>
:root{
  --bg:#f7f3ea;
  --ink:#2b241d;
  --muted:#7d7062;
  --gold:#c89b3c;
  --gold2:#f0d99a;
  --card:#fffdf8;
  --line:#bba77c;
  --shadow:0 12px 35px rgba(67,48,22,.14);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color:var(--ink);
  background:
    radial-gradient(circle at 15% 15%,rgba(240,217,154,.25),transparent 25%),
    radial-gradient(circle at 85% 80%,rgba(200,155,60,.12),transparent 28%),
    var(--bg);
  touch-action:none;
}
button{
  border:0;border-radius:14px;padding:10px 14px;
  background:rgba(255,253,248,.94);color:var(--ink);
  font-weight:700;font-size:14px;box-shadow:0 5px 18px rgba(50,35,15,.12);
  cursor:pointer;backdrop-filter:blur(10px)
}
button:active{transform:scale(.96)}
#toolbar{
  position:fixed;z-index:80;top:12px;right:12px;
   width:58px;min-height:58px;padding:7px;
  display:flex;flex-direction:column;gap:7px;align-items:stretch;
  border:1px solid rgba(200,155,60,.22);border-radius:18px;
  background:rgba(255,253,248,.88);box-shadow:0 8px 30px rgba(50,35,15,.14);
   backdrop-filter:blur(14px);overflow:hidden;transition:.22s ease
}
 #toolbar.open{width:235px;min-width:235px;max-width:235px}
 #toolbar:not(.open){width:130px;min-width:130px;max-width:130px;min-height:46px;height:46px}
 #toolbar:not(.open) #navTitle span:last-child{display:none}
 #navTitle{display:flex;align-items:center;gap:7px;justify-content:center;min-height:42px;font-weight:800;font-size:14px;white-space:nowrap;cursor:pointer}
#navControls{display:flex;gap:7px;align-items:center;flex-wrap:wrap;opacity:0;pointer-events:none;transform:translateY(-5px);transition:.18s ease}
 #toolbar.open #navControls{opacity:1;pointer-events:auto;transform:none}
#navControls button{padding:9px 11px}
#zoomLevel{margin-left:auto;color:var(--muted);font-size:13px;font-weight:700;padding:0 4px}
#viewport{position:fixed;top:0;right:0;bottom:0;left:0;overflow:hidden;cursor:grab;touch-action:none;-ms-touch-action:none;-webkit-overflow-scrolling:auto;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#viewport.dragging{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;-webkit-transform-origin:0 0;will-change:transform;}
#tree{padding:110px 80px 140px;min-width:max-content}
.hero{text-align:center;margin-bottom:70px}
.hero .crest{
  width:86px;height:86px;margin:0 auto 18px;border-radius:50%;
  display:grid;place-items:center;font-size:43px;
  background:linear-gradient(145deg,#fff7dc,#e8c96f);
  border:3px solid #c89b3c;box-shadow:0 10px 30px rgba(130,91,21,.2)
}
.hero h1{font-family:Georgia,serif;font-size:58px;line-height:1.05;margin:0}
.hero p{margin:12px 0 0;color:var(--muted);font-size:21px}
.rebecca{
  position:relative;width:360px;margin:0 auto 85px;text-align:center;
  padding:25px 28px;border-radius:28px;
  background:linear-gradient(145deg,#fff8df,#f0d99a);
  border:3px solid var(--gold);box-shadow:0 18px 45px rgba(118,83,22,.2)
}
.rebecca .role{display:block;text-transform:uppercase;letter-spacing:2px;font-size:12px;font-weight:800;color:#806321}
.rebecca .name{font-family:Georgia,serif;font-size:39px;font-weight:700;margin-top:7px}
.rebecca:after{
  content:"";position:absolute;left:50%;bottom:-86px;width:4px;height:86px;
  background:var(--line);transform:translateX(-50%)
}
.roots{
  display:flex;gap:48px;align-items:flex-start;position:relative;padding-top:0
}
.roots:before{
  content:"";position:absolute;top:0;left:3%;right:3%;height:4px;background:var(--line);border-radius:10px
}
.root{
  width:430px;flex:0 0 430px;position:relative;padding-top:42px
}
.root:before{
  content:"";position:absolute;top:0;left:50%;width:4px;height:42px;
  background:var(--line);transform:translateX(-50%)
}
.card{
  background:rgba(255,253,248,.97);border:2px solid #d8c8a7;
  border-radius:22px;padding:18px 20px;box-shadow:var(--shadow);
  text-align:center;position:relative
}
.root>.card{
  border:3px solid #75603b;
  background:linear-gradient(145deg,#fffdf8,#f8f0dd)
}
.card .tag{
  display:block;color:var(--muted);font-size:11px;text-transform:uppercase;
  letter-spacing:1.5px;font-weight:800;margin-bottom:5px
}
.card .name{font-size:27px;font-weight:800}
.children{
  display:flex;flex-direction:column;gap:11px;position:relative;margin-top:34px;padding-top:2px
}
.children:before{
  content:"";position:absolute;top:-34px;left:50%;width:4px;height:34px;
  background:var(--line);transform:translateX(-50%)
}
.child-wrap{position:relative}
.child-card{
  padding:12px 15px;border-radius:16px;background:var(--card);
  border:1.5px solid #d9cdb6;box-shadow:0 5px 15px rgba(67,48,22,.08);
  font-size:18px;font-weight:700
}
.child-wrap.has-kids>.child-card{
  border-color:#c89b3c;background:linear-gradient(145deg,#fffdf8,#fff8e8)
}
.child-wrap.has-kids:after{
  content:"";position:absolute;left:50%;bottom:-11px;width:3px;height:11px;
  background:var(--line);transform:translateX(-50%)
}
.grandchildren{
  display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
  margin:10px 0 3px;padding:10px 6px 0;position:relative
}
.grandchildren:before{
  content:"";position:absolute;left:50%;top:0;width:3px;height:10px;
  background:var(--line);transform:translateX(-50%)
}
.grandchild{
  padding:9px 12px;border-radius:13px;background:#fbf7ed;
  border:1px solid #dfd2ba;font-size:14px;font-weight:650
}
 .root>.card{background:linear-gradient(145deg,#fffdf8,#f8f0dd)}
 .root>.children>.child-wrap>.child-card,.root>.children .child-wrap .child-card{
   background:linear-gradient(145deg,#fff8df,#f5dfaa);border-color:#c89b3c
 }
 .root>.children .grandchild{
   background:linear-gradient(145deg,#f2f8f6,#dceee8);border-color:#b7d4c9
 }
 .family-hidden{display:none!important}
.baby{
  font-style:italic;color:#927541
}
.dove{font-size:13px}
.footer{
  text-align:center;margin-top:80px;color:#8c7c67;font-size:15px
}
@media(max-width:700px){
   #toolbar{top:10px;right:10px;width:130px;min-width:130px;max-width:130px}
  #toolbar.open{width:min(235px,calc(100vw - 20px))}
  .hero h1{font-size:45px}
}

/* ===== Fonctions interactives ===== */
#featurebar{position:fixed;z-index:81;left:12px;right:12px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:none;pointer-events:none}
#featurebar button{font-size:13px;padding:10px 12px;pointer-events:auto;background:rgba(255,253,248,.93)}
#statsPanel,#miniMap,#descPanel{position:fixed;z-index:90;background:rgba(255,253,248,.96);border:1px solid #ddcda9;box-shadow:0 12px 35px rgba(50,35,15,.18);backdrop-filter:blur(14px);border-radius:18px}
#statsPanel{right:12px;top:82px;width:260px;padding:16px;display:none}
#statsPanel h3,#descPanel h3{margin:0 0 10px;font-family:Georgia,serif}
.statline{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eee4d2}
#miniMap{right:12px;bottom:82px;width:230px;height:135px;display:none;overflow:hidden}
#miniMap .dot{position:absolute;width:5px;height:5px;border-radius:50%;background:#8f6d2f;transform:translate(-50%,-50%);cursor:pointer}
#miniMap .dot.deceased{background:#5f5a54}
#descPanel{left:50%;top:50%;transform:translate(-50%,-50%);width:min(430px,calc(100vw - 28px));padding:20px;display:none;max-height:min(72vh,620px);overflow:auto;z-index:110}
#descPanel.tribute-panel{border:2px solid #c89b3c;box-shadow:0 22px 80px rgba(50,35,15,.3)}
#descPanel .panel-close{float:right;border-radius:50%;padding:6px 10px}
#descPanel .tribute-intro{margin:-2px 0 14px;color:#7d7062;font-size:14px;line-height:1.45}
#descPanel .tribute-card{padding:14px 15px;margin:9px 0;border-radius:15px;background:linear-gradient(145deg,#fffdf8,#f6efe1);border:1px solid #dfd0b2}
#descPanel .tribute-card.deceased{border-color:#b5aea5;background:linear-gradient(145deg,#f9f7f3,#ece8e1)}
#descPanel .descItem{padding:7px 9px;margin:5px 0;border-radius:10px;background:#f8f1e3;font-weight:650}
 #descPanel .search-help{margin:0 0 12px;color:var(--muted);font-size:14px;line-height:1.4}
 #descPanel .search-row{display:flex;gap:8px;margin-bottom:12px}
 #descPanel .search-row input{flex:1;min-width:0;padding:11px 12px;border:1px solid #d8c8a7;border-radius:12px;font:inherit;background:#fff}
 #descPanel .search-row button{padding:10px 13px;background:#2b241d;color:#fff}
 #descPanel .search-results{max-height:42vh;overflow:auto}
 #descPanel .search-results button{display:block;width:100%;margin:6px 0;text-align:left;box-shadow:none;border:1px solid #e1d4bb;background:#f8f1e3}
 #descPanel .legend-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #eee4d2}
 #descPanel .legend-swatch{width:24px;height:24px;flex:0 0 24px;border-radius:8px;border:1px solid #d8c8a7}
 #descPanel .legend-root{background:#f8f0dd}.legend-child{background:#f5dfaa}.legend-grandchild{background:#dceee8}.legend-honour{background:#ece8e1}
 #editHint{position:fixed;z-index:120;left:50%;bottom:78px;transform:translateX(-50%);width:min(430px,calc(100vw - 28px));padding:12px 15px;border-radius:14px;background:#2b241d;color:#fffdf8;box-shadow:0 12px 30px rgba(50,35,15,.25);text-align:center;font-size:14px;line-height:1.4;display:none}
 #editHint.show{display:block}
.modal{position:fixed;inset:0;z-index:50;background:rgba(30,23,14,.45);display:none;align-items:center;justify-content:center;padding:18px}
.modal.open{display:flex}
.modalbox{width:min(430px,100%);background:#fffdf8;border-radius:22px;padding:20px;box-shadow:0 20px 70px rgba(0,0,0,.28)}
.modalbox h2{font-family:Georgia,serif;margin:0 0 14px}
.modalbox input,.modalbox select,.modalbox textarea{width:100%;padding:11px;border:1px solid #d8c8a7;border-radius:12px;margin:6px 0 12px;font:inherit;background:#fff}

.modal-actions button.primary{background:#2b241d;color:white}
.editing .card,.editing .child-card,.editing .grandchild{cursor:pointer;outline:2px dashed rgba(200,155,60,.45);outline-offset:2px}
.person-selected{box-shadow:0 0 0 4px rgba(200,155,60,.35),0 12px 30px rgba(80,55,15,.18)!important}

/* ===== Compatibilité iPhone / iPad / Android ===== */
@supports (-webkit-touch-callout:none){
  html,body{height:100%;min-height:100%;overflow:hidden;}
  input,select,textarea{font-size:16px;}
}
@media(max-width:700px){
  #viewport{position:fixed;inset:0;width:100%;height:100%;min-height:100dvh;}
  #tree{padding:90px 32px 120px;}
  .roots{gap:28px;}
  .root{width:340px;flex-basis:340px;}
  .hero h1{font-size:42px;}
  .hero p{font-size:17px;}
  .rebecca{width:320px;}
}

#viewport,#world,#tree{contain:layout style;}
@media(max-width:700px){
  #viewport{min-width:100vw;min-height:100vh;min-height:100dvh;}
  #world{min-width:1px;min-height:1px;}
}
